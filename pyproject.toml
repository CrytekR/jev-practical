[project]
name = "jev-practical"
version = "0.1.0"
description = "对比通用模型与 Jev 类开源决策模型的准确率和推理性能"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "jev-practical" }]

[project.scripts]
jev-compare = "jev_compare.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
